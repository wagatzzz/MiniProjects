<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <script src="https://cdn.tailwindcss.com"></script>

  <title>Frontend Mentor | Product list with cart</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 11px;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body class="bg-orange-50 p-10">
  <div class="container mx-auto p-4 flex">
    <!-- Left Side: Dessert Menu -->
    <div class="w-2/3">
      <h1 class="text-4xl font-bold mb-8 text-orange-900">Desserts</h1>
      <div id="menu-items" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Menu items will be injected here -->
      </div>
    </div>

    <!-- Right Side: Cart -->
    <div class="w-1/3 bg-white p-6 shadow-lg rounded-lg ml-8">
      <h2 class="text-2xl font-bold mb-4">Your Cart (<span id="cart-count">0</span>)</h2>
      <ul id="cart-items" class="mb-4">
        <!-- Cart items will be injected here -->
      </ul>
      <div class="flex justify-between items-center mb-6">
        <p class="text-xl font-bold">Order Total:</p>
        <p id="cart-total" class="text-xl font-bold">$0.00</p>
      </div>
      <button id="confirm-order" class="w-full bg-orange-500 text-white px-4 py-2 rounded-md hover:bg-orange-600">
        Confirm Order
      </button>
    </div>
  </div>


  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </div>

  <script src="index.js"></script>
</body>

</html>
